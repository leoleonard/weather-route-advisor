name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: SPA fallback
        run: cp dist/weather-route-advisor/browser/index.html dist/weather-route-advisor/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/weather-route-advisor/browser

  deploy:
    # GitHub Pages is only served for public repositories on the free plan
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
